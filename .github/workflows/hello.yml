name: Hello GitHub Actions

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Say hello
        run: echo "Hello from GitHub Actions!"

      - name: Show files
        run: ls -la

      - name: System information
        run: |
          pwd
          ls -la
          echo "GitHub Actions is running"